services:
  rtsp_detect:
    network_mode: host
    build: .
    user: 1000:1000
    restart: unless-stopped
    volumes:
      - ./:/usr/src/app
    working_dir: /usr/src/app
    command:
      [
        "python3",
        "-m", "app.rtsp_detect_people",
        "--config", "configuration.json",
        "--save",
        "--email",
        "--ntfy",
        "--web", "5000"
      ]
